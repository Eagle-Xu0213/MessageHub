<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>去年今日回顾 - MessageHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #2c3e50; line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
        .nav-links { margin-bottom: 18px; font-size: 14px; }
        .nav-links a { color: #4f46e5; text-decoration: none; }
        .nav-links a:hover { text-decoration: underline; }
        .header { background: #fff; padding: 22px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        h1 { font-size: 22px; margin-bottom: 6px; }
        .subtitle { color: #8a94a6; font-size: 13px; margin-bottom: 18px; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        label { font-size: 14px; color: #5a6478; }
        input[type="date"], select { padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 14px; background: #fff; }
        button { padding: 9px 18px; background: #4f46e5; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: opacity .2s; }
        button:hover { opacity: .88; }
        button:disabled { opacity: .55; cursor: wait; }
        .btn-green { background: #16a34a; }
        .btn-purple { background: #7c3aed; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .stat-card { background: #fff; padding: 18px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .stat-number { font-size: 28px; font-weight: 700; color: #4f46e5; }
        .stat-label { font-size: 12px; color: #8a94a6; margin-top: 4px; }
        .panel { background: #fff; padding: 18px 22px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .panel h3 { font-size: 15px; margin-bottom: 12px; }
        .group-item { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f0f1f4; font-size: 14px; }
        .group-item:last-child { border-bottom: none; }
        .messages-list { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; }
        .message-item { padding: 13px 20px; border-bottom: 1px solid #f2f3f6; }
        .message-item:last-child { border-bottom: none; }
        .message-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; }
        .sender { font-weight: 600; color: #4f46e5; }
        .time { color: #98a1b3; }
        .message-text { color: #333; font-size: 14px; word-break: break-word; }
        .empty-state { text-align: center; padding: 48px 20px; color: #98a1b3; }
        .loading { text-align: center; padding: 20px; color: #8a94a6; }
        .ai-banner { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
        .ai-warn { background: #fff7e6; border-left: 4px solid #f59e0b; color: #92400e; }
        .ai-ok { background: #f0fdf4; border-left: 4px solid #16a34a; color: #166534; }
        .summary-section { margin-bottom: 16px; }
        .summary-section strong { display: block; margin-bottom: 6px; font-size: 14px; }
        .summary-section p, .summary-section li { font-size: 14px; color: #404a5c; }
        .summary-section ul { padding-left: 20px; }
        .summary-section li { margin: 4px 0; }
        .quote { font-style: italic; color: #6b7280; }
        .footnote { margin-top: 18px; padding: 10px; background: #f7f8fa; border-radius: 6px; font-size: 12px; color: #98a1b3; }
        .msg-more { text-align: center; padding: 14px; color: #8a94a6; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="/">← 返回首页</a>
            <span> / 去年今日回顾</span>
        </div>

        <div class="header">
            <h1>📅 去年今日回顾</h1>
            <div class="subtitle">按北京时间查询历史聊天记录，并由 AI 生成当日回顾</div>
            <div class="controls">
                <label>日期 <input type="date" id="datePicker"></label>
                <label>群聊 <select id="groupSelect"><option value="">全部群聊</option></select></label>
                <button onclick="loadMemories()">查询</button>
                <button class="btn-green" onclick="loadLastYear()">回到去年今日</button>
                <button class="btn-purple" id="aiButton" onclick="summarizeMemories()">🤖 AI 回顾</button>
            </div>
        </div>

        <div id="loading" class="loading" style="display:none;">加载中...</div>

        <div id="stats" class="stats" style="display:none;">
            <div class="stat-card"><div class="stat-number" id="totalMessages">0</div><div class="stat-label">消息总数</div></div>
            <div class="stat-card"><div class="stat-number" id="activeChats">0</div><div class="stat-label">活跃群聊</div></div>
            <div class="stat-card"><div class="stat-number" id="activeMembers">0</div><div class="stat-label">活跃成员</div></div>
        </div>

        <div id="groupStats" class="panel" style="display:none;"></div>

        <div id="aiSummary" class="panel" style="display:none;">
            <h3>🤖 AI 回顾总结</h3>
            <div id="summaryContent"></div>
        </div>

        <div id="messages" class="messages-list">
            <div class="empty-state">选择日期并点击查询，查看历史记录</div>
        </div>
    </div>

    <script>
        // ---------- 工具函数 ----------
        const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = (value === null || value === undefined) ? '' : String(value);
            return div.innerHTML;
        }

        function renderList(items, emptyText) {
            if (!Array.isArray(items) || items.length === 0) return `<li>${emptyText}</li>`;
            return items.map(i => `<li>${escapeHtml(i)}</li>`).join('');
        }

        // ---------- 初始化 ----------
        // 严格日历定义：今天 2026-11-14 → 去年今日 2025-11-14
        const initTarget = new Date();
        initTarget.setFullYear(initTarget.getFullYear() - 1);
        document.getElementById('datePicker').value = fmt(initTarget);

        fetch('/api/memories/groups')
            .then(r => r.json())
            .then(data => {
                const select = document.getElementById('groupSelect');
                (data.groups || []).forEach(g => {
                    const option = document.createElement('option');
                    option.value = g.conversation_id;
                    option.textContent = g.conversation_name;
                    select.appendChild(option);
                });
            })
            .catch(() => {});

        // ---------- 查询 ----------
        async function loadLastYear() {
            const target = new Date();
            target.setFullYear(target.getFullYear() - 1);
            document.getElementById('datePicker').value = fmt(target);
            await loadMemories();
        }

        async function loadMemories() {
            const date = document.getElementById('datePicker').value;
            const groupId = document.getElementById('groupSelect').value;
            const loading = document.getElementById('loading');
            const msgDiv = document.getElementById('messages');

            loading.style.display = 'block';
            msgDiv.innerHTML = '';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('groupStats').style.display = 'none';
            document.getElementById('aiSummary').style.display = 'none';

            try {
                const url = `/api/memories?date=${encodeURIComponent(date)}${groupId ? `&conversation_id=${encodeURIComponent(groupId)}` : ''}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                loading.style.display = 'none';

                if (!data.has_data) {
                    msgDiv.innerHTML = '<div class="empty-state">当前归档中未找到该日期记录</div>';
                    return;
                }

                document.getElementById('stats').style.display = 'grid';
                document.getElementById('totalMessages').textContent = data.total_messages;
                document.getElementById('activeChats').textContent = data.active_chats;
                document.getElementById('activeMembers').textContent = data.active_members;

                const groupDiv = document.getElementById('groupStats');
                if (data.group_stats && data.group_stats.length > 0) {
                    groupDiv.innerHTML = '<h3>按群聊统计</h3>' + data.group_stats.map(gs =>
                        `<div class="group-item"><span>${escapeHtml(gs.conversation_name)}</span>` +
                        `<span>${gs.msg_count} 条消息 · ${gs.member_count} 人参与</span></div>`
                    ).join('');
                    groupDiv.style.display = 'block';
                }

                const list = data.messages || [];
                if (list.length === 0) {
                    msgDiv.innerHTML = '<div class="empty-state">该群聊在该日期无消息</div>';
                    return;
                }

                // 首屏渲染 300 条，其余按需展开，避免大量 DOM 卡顿
                const BATCH = 300;
                const buildHtml = items => items.map(msg => `
                    <div class="message-item">
                        <div class="message-header">
                            <span class="sender">${escapeHtml(msg.sender_name)}</span>
                            <span class="time">${escapeHtml(String(msg.sent_at || '').replace('T', ' ').replace('+08:00', ''))}</span>
                        </div>
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                    </div>`).join('');

                msgDiv.innerHTML = buildHtml(list.slice(0, BATCH));
                if (list.length > BATCH) {
                    const more = document.createElement('div');
                    more.className = 'msg-more';
                    more.textContent = `还有 ${list.length - BATCH} 条，点击展开全部`;
                    more.style.cursor = 'pointer';
                    more.onclick = () => {
                        msgDiv.innerHTML = buildHtml(list);
                    };
                    msgDiv.appendChild(more);
                }
            } catch (error) {
                loading.style.display = 'none';
                msgDiv.innerHTML = `<div class="empty-state">查询失败：${escapeHtml(error.message)}</div>`;
            }
        }

        // ---------- AI 回顾 ----------
        async function summarizeMemories() {
            const date = document.getElementById('datePicker').value;
            const groupId = document.getElementById('groupSelect').value;
            if (!date) { alert('请先选择日期'); return; }

            const button = document.getElementById('aiButton');
            const summaryDiv = document.getElementById('aiSummary');
            const contentDiv = document.getElementById('summaryContent');

            button.disabled = true;
            button.textContent = 'AI 生成中…';
            summaryDiv.style.display = 'block';
            contentDiv.innerHTML = '<div class="loading">正在分析当天的聊天记录，请稍候…</div>';

            try {
                const res = await fetch('/api/memories/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        date: date,
                        conversation_id: groupId || null,
                        force_refresh: false
                    })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
                const data = await res.json();

                if (!data.success || !data.summary) {
                    contentDiv.innerHTML = `<div class="ai-banner ai-warn">⚠️ ${escapeHtml(data.error || 'AI 生成失败')}，消息记录与统计仍可正常浏览。</div>`;
                    return;
                }

                const s = data.summary;
                const banner = data.fallback_only
                    ? '<div class="ai-banner ai-warn">⚠️ AI 服务暂时不可用，以下为基于真实消息的本地规则摘要。</div>'
                    : '<div class="ai-banner ai-ok">✓ 已由 AI 基于当天真实消息生成</div>';

                contentDiv.innerHTML = banner + `
                    <div class="summary-section">
                        <strong>📊 分析范围</strong>
                        <p>${escapeHtml(s.message_count || 0)} 条消息 · ${escapeHtml(s.conversation || '全部群聊')} · ${escapeHtml(date)}</p>
                    </div>
                    <div class="summary-section">
                        <strong>🎯 那天主要在讨论什么</strong>
                        <p>${escapeHtml(s.topic_summary || '无概括')}</p>
                    </div>
                    <div class="summary-section">
                        <strong>✨ 值得回忆的事件</strong>
                        <ul>${renderList(s.key_events, '暂无记录')}</ul>
                    </div>
                    <div class="summary-section">
                        <strong>💬 主要话题</strong>
                        <ul>${renderList(s.main_topics, '暂无话题')}</ul>
                    </div>
                    <div class="summary-section">
                        <strong>🗨️ 代表性发言</strong>
                        <ul class="quote">${renderList(s.representative_quotes, '暂无代表性发言')}</ul>
                    </div>
                    <div class="summary-section">
                        <strong>🌟 整体氛围</strong>
                        <p>${escapeHtml(s.atmosphere || '未评估')}</p>
                    </div>
                    <div class="footnote">ℹ️ ${escapeHtml(s.source_note || '基于数据库真实消息生成')}</div>
                `;
                summaryDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } catch (error) {
                contentDiv.innerHTML = `<div class="ai-banner ai-warn">⚠️ 生成失败：${escapeHtml(error.message)}。消息记录与统计仍可正常浏览。</div>`;
            } finally {
                button.disabled = false;
                button.textContent = '🤖 AI 回顾';
            }
        }

        // 页面加载时自动查询去年今日
        loadLastYear();
    </script>
</body>
</html>
