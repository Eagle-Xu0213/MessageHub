<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>检测范围管理 · MessageHub</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f7fa; color: #1f2733; line-height: 1.6;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .topnav { display: flex; gap: 14px; margin-bottom: 18px; font-size: 14px; }
  .topnav a { color: #1668dc; text-decoration: none; }
  .topnav a:hover { text-decoration: underline; }
  .topnav a.cur { font-weight: 650; color: #1f2733; }
  h1 { font-size: 25px; margin: 0 0 6px; }
  .sub { color: #6b7785; font-size: 14px; margin-bottom: 24px; }
  .card {
    background: #fff; border: 1px solid #e3e8ef; border-radius: 12px;
    padding: 20px 22px; margin-bottom: 18px;
    box-shadow: 0 1px 3px rgba(20,40,80,.04);
  }
  .card h2 { font-size: 16px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  input[type=text] {
    border: 1px solid #d5dde8; border-radius: 7px; padding: 7px 10px;
    font-size: 13px; font-family: inherit; outline: none; background: #fff; color: #1f2733;
  }
  input[type=text]:focus { border-color: #1668dc; }
  #search { width: 260px; }
  select {
    border: 1px solid #d5dde8; border-radius: 7px; padding: 7px 10px;
    font-size: 13px; font-family: inherit; background: #fff; color: #1f2733; outline: none;
  }
  button {
    border: 1px solid #d5dde8; background: #fff; color: #26313f;
    border-radius: 7px; padding: 7px 15px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: #1668dc; color: #1668dc; }
  button.primary { background: #1668dc; border-color: #1668dc; color: #fff; }
  button.primary:hover { background: #1158bd; color: #fff; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .toolbar .spacer { flex: 1; }
  .hint { font-size: 12.5px; color: #7a8698; }
  #list { max-height: 560px; overflow-y: auto; border: 1px solid #e8edf4; border-radius: 9px; }
  .conv {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px dashed #e6ebf2; font-size: 13.5px;
  }
  .conv:last-child { border-bottom: none; }
  .conv:hover { background: #f7fafd; }
  .conv .nm { flex: 1; min-width: 0; }
  .conv .nm .n { font-weight: 600; word-break: break-all; }
  .conv .nm .meta { font-size: 12px; color: #7a8698; margin-top: 1px; }
  .conv .nm .aireason { font-size: 12px; color: #b06a00; margin-top: 2px; }
  .conv .nm .aireason.off { color: #98a3b3; }
  .kbadge {
    display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 11.5px;
    background: #eef3fb; color: #34527d; margin-right: 4px; flex: none;
  }
  .kbadge.contact { background: #f3eefb; color: #6b3fa0; }
  .savebar {
    display: flex; align-items: center; gap: 14px; margin-top: 14px;
    position: sticky; bottom: 0; background: #fff; padding: 10px 4px;
    border-top: 1px solid #e8edf4;
  }
  .savebar .summary { font-size: 13px; color: #4a5768; }
  .savebar .summary b { color: #1668dc; }
  .empty { color: #98a3b3; font-size: 13px; text-align: center; padding: 60px 0; }
  .note {
    background: #fffbe8; border: 1px solid #f5e2a8; border-radius: 9px;
    padding: 13px 16px; font-size: 13px; color: #6b5518; margin-bottom: 18px;
  }
</style>
<link rel="stylesheet" href="/static/glass.css">
<script src="/static/ambient.js"></script>
</head>
<body class="secondary-page">
<div class="wrap">
  <div class="topnav">
    <a href="/">🏠 工作台</a>
    <a href="/brief">📋 每日简报</a>
    <a href="/live">⚡ 实时消息接入</a>
    <a href="/select" class="cur">🔍 检测范围</a>
  </div>

  <h1>关注会话</h1>
  <div class="sub">选择想关注的群或联系人。取消关注后，已保存的历史仍可查看。</div>

  <div class="note" id="snapWarn" hidden>
    微信会话清单还没同步。请保持微信登录，完成首次采集后刷新本页。
  </div>

  <div class="card">
    <h2>会话清单 <span class="hint" id="countInfo"></span></h2>
    <div class="toolbar">
      <input type="text" id="search" aria-label="搜索会话" placeholder="搜索群名 / 联系人…">
      <select id="kindFilter" aria-label="会话类型">
        <option value="all">全部类型</option>
        <option value="group">仅群聊</option>
        <option value="contact">仅联系人</option>
      </select>
      <div class="spacer"></div>
    </div>
    <details id="advanced">
      <summary>高级设置</summary>
      <p class="hint">工作和混合会话都会筛选工作消息。混合适合包含闲聊的会话。</p>
    </details>
    <div id="list"><div class="empty">加载中…</div></div>
    <div class="savebar">
      <span class="summary">已关注 <b id="follow-count">0</b> 个会话</span>
      <div class="spacer" style="flex:1"></div>
      <span class="hint" id="dirtyHint" role="status"></span>
      <button class="primary" id="saveBtn" disabled>保存关注范围</button>
    </div>
  </div>
</div>

<script>
const $ = selector => document.querySelector(selector);
const segments = {group: 'groups', contact: 'contacts'};
const levels = ['work', 'watch', 'excluded'];
const labels = {work: '工作', watch: '混合', excluded: '未关注'};
const fromSetup = new URLSearchParams(location.search).has('setup');
const followed = level => level === 'work' || level === 'watch';
let conversations = [];
let bindings = {};
let saving = false;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g,
    char => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[char]);
}

function render() {
  const advanced = $('#advanced').open;
  const query = $('#search').value.trim().toLowerCase();
  const kind = $('#kindFilter').value;
  const visible = conversations.filter(row =>
    (kind === 'all' || kind === row.kind) && row.name.toLowerCase().includes(query));
  $('#list').innerHTML = visible.length ? visible.map(row => {
    const control = advanced
      ? `<select data-row="${row.index}" aria-label="${escapeHtml(row.name)}分级">${levels.map(level =>
          `<option value="${level}" ${(row.level || 'excluded') === level ? 'selected' : ''}>${labels[level]}</option>`
        ).join('')}</select>`
      : `<label><input type="checkbox" aria-label="关注 ${escapeHtml(row.name)}" data-row="${row.index}" ${followed(row.level) ? 'checked' : ''}> 关注</label>`;
    return `<div class="conv"><span class="kbadge ${row.kind}">${row.kind === 'group' ? '群' : '人'}</span>
      <div class="nm"><div class="n">${escapeHtml(row.name)}</div></div>
      <div>${control}</div></div>`;
  }).join('') : '<div class="empty">没有可显示的会话</div>';
  $('#countInfo').textContent = `（${visible.length} / ${conversations.length}）`;
  refreshSaveState();
}

function refreshSaveState() {
  $('#follow-count').textContent = conversations.filter(row => followed(row.level)).length;
  $('#saveBtn').disabled = saving || !conversations.some(row => row.level !== row.savedLevel);
  $('#list').querySelectorAll('[data-row]').forEach(input => { input.disabled = saving; });
}

async function load() {
  try {
    const response = await fetch('/api/scope/conversations', {signal: AbortSignal.timeout(8000)});
    if (!response.ok) throw new Error();
    const data = await response.json();
    $('#snapWarn').hidden = data.snapshot_available;
    bindings = data.group_ids || {};
    const rows = [...data.conversations];
    for (const [kind, segment] of Object.entries(segments)) {
      const known = new Set(rows.filter(row => row.kind === kind).map(row => row.name));
      for (const name of new Set(Object.values(data.levels[segment]).flat())) {
        if (!known.has(name)) rows.push({kind, name});
      }
    }
    conversations = rows.map((row, index) => {
      const selected = data.levels[segments[row.kind]];
      const level = levels.find(key => selected[key].includes(row.name)) || null;
      return {...row, index, level, savedLevel: level};
    });
    render();
  } catch {
    $('#list').textContent = '会话清单加载失败，请刷新重试。';
  }
}

$('#list').addEventListener('change', event => {
  const input = event.target.closest('[data-row]');
  if (!input || saving) return;
  const row = conversations[Number(input.dataset.row)];
  const level = input.type === 'checkbox'
    ? (input.checked ? (followed(row.savedLevel) ? row.savedLevel : 'watch') : followed(row.savedLevel) ? 'excluded' : row.savedLevel)
    : input.value;
  for (const match of conversations) {
    if (match.kind === row.kind && match.name === row.name) match.level = level;
  }
  $('#dirtyHint').textContent = conversations.some(row => row.level !== row.savedLevel) ? '有未保存的修改' : '';
  render();
  $('#list').querySelector(`[data-row="${row.index}"]`)?.focus();
});

$('#advanced').addEventListener('toggle', render);
$('#search').addEventListener('input', render);
$('#kindFilter').addEventListener('change', render);

function scopePayload() {
  const payload = {};
  for (const segment of Object.values(segments)) {
    payload[segment] = Object.fromEntries(levels.map(level => [
      level, [...new Set(conversations.filter(row =>
        segments[row.kind] === segment && row.level === level).map(row => row.name))],
    ]));
  }
  payload.group_ids = Object.fromEntries(levels.map(level => [level, {}]));
  const previouslyBound = Object.assign({}, ...levels.map(level => bindings[level] || {}));
  for (const [id, name] of Object.entries(previouslyBound)) {
    const level = levels.find(key => payload.groups[key].includes(name));
    if (level) payload.group_ids[level][id] = name;
  }
  const groupsByName = new Map();
  for (const row of conversations) {
    if (row.kind !== 'group' || !row.id) continue;
    const matches = groupsByName.get(row.name) || [];
    matches.push(row);
    groupsByName.set(row.name, matches);
  }
  const boundNames = new Set(Object.values(previouslyBound));
  for (const rows of groupsByName.values()) {
    const [row] = rows;
    if (rows.length === 1 && row.level && row.level !== row.savedLevel && !boundNames.has(row.name)) {
      payload.group_ids[row.level][row.id] = row.name;
    }
  }
  return payload;
}

$('#saveBtn').addEventListener('click', async () => {
  if (saving) return;
  saving = true;
  refreshSaveState();
  $('#dirtyHint').textContent = '正在保存…';
  const payload = scopePayload();
  try {
    const response = await fetch('/api/scope/config', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
      signal: AbortSignal.timeout(8000),
    });
    if (!response.ok) throw new Error('保存失败，请重试。');
    bindings = payload.group_ids;
    for (const row of conversations) row.savedLevel = row.level;
    $('#dirtyHint').textContent = '已保存。等待下一轮微信同步。';
    if (fromSetup) location.assign('/');
  } catch (error) {
    $('#dirtyHint').textContent = error.message;
  } finally {
    saving = false;
    refreshSaveState();
  }
});

load();
</script>
</body>
</html>
