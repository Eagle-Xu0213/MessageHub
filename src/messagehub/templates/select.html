<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>检测范围管理 · MessageHub</title>
  <link rel="stylesheet" href="/static/glass.css">
  <script src="/static/ambient.js"></script>
  <style>
    .scope-page { padding: clamp(20px, 4vw, 52px) clamp(14px, 4vw, 60px); }
    .scope-wrap { max-width: 1320px; margin: auto; }
    .scope-back { display: inline-flex; align-items: center; min-height: 40px; color: var(--accent); font-weight: 600; }
    .scope-heading { margin: 16px 0 28px; }
    .scope-heading h1 { margin: 0 0 6px; font-size: clamp(28px, 4vw, 44px); letter-spacing: -.035em; }
    .scope-heading p, .scope-hint { margin: 0; color: var(--sub); line-height: 1.6; }
    .scope-layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); align-items: start; gap: 24px; }
    .platform-switch { display: grid; gap: 8px; }
    .scope-page .platform-switch button {
      min-height: 54px; width: 100%; text-align: left; padding: 12px 16px;
      color: var(--sub); background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r); font-size: 16px; font-weight: 600;
    }
    .scope-page .platform-switch button:hover { color: var(--ink); border-color: var(--accent); }
    .scope-page .platform-switch button[aria-pressed="true"] {
      background: var(--accent-soft); color: var(--accent); border-color: var(--accent);
    }
    .scope-panel { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
    .scope-controls { padding: 22px 24px 16px; }
    .scope-summary { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px 18px; }
    .scope-summary h2 { font-size: 22px; margin: 0 0 3px; }
    .scope-count { color: var(--sub); font-size: 14px; font-variant-numeric: tabular-nums; }
    .scope-page #saveBtn { min-height: 44px; padding-inline: 20px; font-size: 15px; }
    #dirtyHint { display: block; color: var(--sub); margin-top: 8px; min-height: 1.5em; }
    .select-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) repeat(2, minmax(124px, auto)); gap: 10px; margin-top: 12px; }
    .scope-page #search, .scope-page #kindFilter, .scope-page #levelFilter {
      min-height: 44px; width: 100%; min-width: 0; padding-inline: 12px; font-size: 15px;
    }
    .scope-hint { font-size: 14px; margin-top: 8px; }
    .scope-page [hidden] { display: none; }
    .scope-list { max-height: clamp(280px, 57dvh, 650px); overflow: auto; overscroll-behavior: contain; border-top: 1px solid var(--line); }
    .scope-page .conv {
      display: grid; grid-template-columns: 36px minmax(0, 1fr) minmax(90px, auto);
      gap: 14px; min-height: 67px; margin: 0; padding: 8px 24px;
      border: 0; border-bottom: 1px solid var(--line); border-radius: 0; align-items: center;
    }
    .scope-page .conv:last-child { border-bottom: 0; }
    .scope-page .conv:hover { background: var(--surface-2); }
    .scope-page .conv .kbadge { width: 34px; height: 34px; font-size: 14px; }
    .scope-page .conv .n { font-size: 16px; word-break: normal; overflow-wrap: anywhere; }
    .scope-page .conv small { display: block; font-size: 12px; color: var(--sub); margin-top: 2px; }
    .scope-levels { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: var(--r); }
    .scope-levels label { position: relative; cursor: pointer; }
    .scope-levels input { position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
    .scope-levels span { display: grid; place-items: center; min-height: 42px; padding-inline: 10px; white-space: nowrap; border-radius: 6px; color: var(--sub); }
    .scope-levels label:hover span { background: var(--surface-2); }
    .scope-levels input:checked + span { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .scope-levels input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
    .scope-levels input:disabled { cursor: default; }
    .scope-page :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .scope-page .note { margin: 0 0 12px; }
    @media (max-width: 700px) {
      .scope-layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .platform-switch { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .scope-page .platform-switch button { text-align: center; }
      .scope-heading { margin: 12px 0 18px; }
      .scope-controls { padding: 15px; }
      .scope-page .conv { padding-inline: 15px; gap: 9px; grid-template-columns: 34px minmax(0, 1fr) auto; }
      .scope-list { max-height: 55dvh; }
      .scope-page #saveBtn { padding-inline: 12px; }
    }
    @media (max-width: 560px) {
      .select-toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .select-toolbar #search { grid-column: 1 / -1; }
    }
    @media (max-width: 480px) {
      .scope-page .conv { grid-template-columns: 34px minmax(0, 1fr); }
      .scope-levels { grid-column: 2; justify-self: start; }
    }
  </style>
</head>

<body class="scope-page">
<main class="scope-wrap">
  <a class="scope-back" href="/">← 返回工作台</a>
  <header class="scope-heading">
    <h1>检测范围</h1>
    <p>选择 MessageHub 要关注的群聊和联系人。</p>
  </header>

  <div class="scope-layout">
    <nav class="platform-switch" aria-label="消息平台">
      <button type="button" data-platform="wechat" aria-pressed="true">微信</button>
      <button type="button" data-platform="qq" aria-pressed="false">QQ</button>
    </nav>

    <section class="scope-panel" aria-labelledby="platformTitle">
      <div class="scope-controls">
        <div class="note" id="snapWarn" hidden>微信会话列表尚未同步，请保持微信登录，等待首次同步完成。</div>
        <div class="scope-summary">
          <div>
            <h2 id="platformTitle">微信会话</h2>
            <div class="scope-count">已关注 <strong id="follow-count">0</strong><span id="countInfo"></span></div>
          </div>
          <button type="button" class="primary" id="saveBtn" disabled>保存微信关注范围</button>
        </div>
        <span id="dirtyHint" role="status"></span>
        <div class="select-toolbar">
          <input type="search" id="search" aria-label="搜索会话" placeholder="搜索群名或联系人">
          <select id="kindFilter" aria-label="会话类型">
            <option value="all">全部会话</option>
            <option value="group">群聊</option>
            <option value="contact">联系人</option>
          </select>
          <select id="levelFilter" aria-label="关注状态">
            <option value="all">全部状态</option>
            <option value="followed">已关注</option>
            <option value="work">工作</option>
            <option value="watch">混合</option>
            <option value="excluded">未关注</option>
          </select>
        </div>
        <p class="scope-hint" id="qqNote" hidden>仅保存关注后收到的 QQ 新消息。</p>
      </div>
      <div id="list" class="scope-list" tabindex="0" aria-label="会话列表">
        <div class="empty">正在加载会话…</div>
      </div>
    </section>
  </div>
</main>

<script>
const $ = selector => document.querySelector(selector);
const segments = {group: 'groups', contact: 'contacts'};
const levels = ['work', 'watch', 'excluded'];
const labels = {work: '工作', watch: '混合', excluded: '未关注'};
const fromSetup = new URLSearchParams(location.search).has('setup');
const followed = level => level === 'work' || level === 'watch';
let conversations = [];
let bindings = {};
let saving = false;
let platform = 'wechat';
let snapshotAvailable = true;
const platformNames = {wechat: '微信', qq: 'QQ'};
const drafts = {
  wechat: {query: '', kind: 'all', level: 'all', message: ''},
  qq: {query: '', kind: 'all', level: 'all', message: ''},
};
const platformOf = row => row.platform === 'qq' ? 'qq' : 'wechat';
const platformRows = () => conversations.filter(row => platformOf(row) === platform);
const hasChanges = () => platformRows().some(row => row.level !== row.savedLevel);
const showMessage = message => {
  drafts[platform].message = message;
  $('#dirtyHint').textContent = message;
};

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g,
    char => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[char]);
}

function activityLabel(row) {
  if (!row.last_received) return '暂无活动时间';
  return '最近收到 ' + new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false,
  }).format(new Date(row.last_received * 1000));
}

function render() {
  const query = $('#search').value.trim().toLowerCase();
  const kind = $('#kindFilter').value;
  const level = $('#levelFilter').value;
  const rows = platformRows();
  const visible = rows.filter(row => {
    const matchesLevel = level === 'all' || level === (row.level || 'excluded') ||
      (level === 'followed' && followed(row.level));
    return matchesLevel && (kind === 'all' || kind === row.kind) && row.name.toLowerCase().includes(query);
  });
  $('#list').innerHTML = visible.length ? visible.map(row => {
    const control = `<div class="scope-levels" role="radiogroup" aria-label="${escapeHtml(row.name)}分级">${levels.map(level =>
      `<label><input type="radio" name="scope-${row.index}" data-row="${row.index}" value="${level}" ${(row.level || 'excluded') === level ? 'checked' : ''}><span>${labels[level]}</span></label>`
    ).join('')}</div>`;
    return `<div class="conv"><span class="kbadge ${row.kind}">${row.kind === 'group' ? '群' : '私'}</span>
      <div class="nm"><div class="n">${escapeHtml(row.name)} ${row.platform === 'qq' ? `<small>${escapeHtml(row.identity_hint)}${row.kind === 'group' ? ' · ' + escapeHtml(activityLabel(row)) : ''}</small>` : ''}</div></div>
      ${control}</div>`;
  }).join('') : '<div class="empty">' + (rows.length ? '没有匹配的会话' :
    platform === 'qq' ? '暂无 QQ 会话。连接 QQ 采集引擎或导入 QQ 文件后刷新本页。' : '暂无微信会话。') + '</div>';
  $('#countInfo').textContent = ` · 显示 ${visible.length} / ${rows.length} 个会话`;
  $('#platformTitle').textContent = platformNames[platform] + '会话';
  $('#saveBtn').textContent = '保存' + platformNames[platform] + '关注范围';
  $('#snapWarn').hidden = platform !== 'wechat' || snapshotAvailable;
  $('#qqNote').hidden = platform !== 'qq';
  $('#dirtyHint').textContent = drafts[platform].message;
  for (const button of document.querySelectorAll('[data-platform]')) {
    button.setAttribute('aria-pressed', String(button.dataset.platform === platform));
    button.disabled = saving;
  }
  refreshSaveState();
}

function refreshSaveState() {
  $('#follow-count').textContent = platformRows().filter(row => followed(row.level)).length;
  $('#saveBtn').disabled = saving || !hasChanges();
  $('#list').querySelectorAll('[data-row]').forEach(input => { input.disabled = saving; });
}

let loadingConversations = false;
let scopeRevision = 0;
let lastConversationPayload = '';
const scopeRefreshBlocked = () => saving ||
  conversations.some(row => row.level !== row.savedLevel) || $('#list').contains(document.activeElement);

async function load(background = false) {
  if (loadingConversations || (background && scopeRefreshBlocked())) return;
  loadingConversations = true;
  const revision = scopeRevision;
  try {
    const response = await fetch('/api/scope/conversations', {signal: AbortSignal.timeout(8000)});
    if (!response.ok) throw new Error();
    const data = await response.json();
    if (background && (revision !== scopeRevision || scopeRefreshBlocked())) return;
    const payload = JSON.stringify(data);
    if (background && payload === lastConversationPayload) return;
    lastConversationPayload = payload;
    snapshotAvailable = data.snapshot_available;
    bindings = data.group_ids || {};
    const rows = [...data.conversations];
    for (const [kind, segment] of Object.entries(segments)) {
      const known = new Set(rows.filter(row => row.kind === kind && row.platform !== 'qq').map(row => row.name));
      for (const name of new Set(Object.values(data.levels[segment]).flat())) {
        if (!known.has(name)) rows.push({kind, name});
      }
    }
    conversations = rows.map((row, index) => {
      if (row.platform === 'qq') return {...row, index, savedLevel: row.level};
      const selected = data.levels[segments[row.kind]];
      const level = levels.find(key => selected[key].includes(row.name)) || null;
      return {...row, index, level, savedLevel: level};
    });
    render();
  } catch {
    if (!background) $('#list').textContent = '会话列表加载失败，请刷新页面重试。';
  } finally {
    loadingConversations = false;
  }
}

$('#list').addEventListener('change', event => {
  const input = event.target.closest('[data-row]');
  if (!input || saving) return;
  const row = conversations[Number(input.dataset.row)];
  const level = input.value;
  scopeRevision++;
  for (const match of conversations) {
    if (row.platform === 'qq' ? match === row :
      match.platform !== 'qq' && match.kind === row.kind && match.name === row.name) match.level = level;
  }
  showMessage(hasChanges() ? '有未保存的更改' : '');
  render();
  const selected = $('#list').querySelector(`[data-row="${row.index}"]:checked`);
  (selected || $('#levelFilter')).focus({preventScroll: true});
});

$('.platform-switch').addEventListener('click', event => {
  const button = event.target.closest('[data-platform]');
  if (!button || saving || button.dataset.platform === platform) return;
  drafts[platform].query = $('#search').value;
  drafts[platform].kind = $('#kindFilter').value;
  drafts[platform].level = $('#levelFilter').value;
  platform = button.dataset.platform;
  $('#search').value = drafts[platform].query;
  $('#kindFilter').value = drafts[platform].kind;
  $('#levelFilter').value = drafts[platform].level;
  $('#list').scrollTop = 0;
  render();
});

$('#search').addEventListener('input', render);
$('#kindFilter').addEventListener('change', render);
$('#levelFilter').addEventListener('change', render);

function scopePayload() {
  if (platform === 'qq') {
    return {qq_levels: Object.fromEntries(platformRows().filter(row => followed(row.level))
      .map(row => [row.id, row.level]))};
  }
  const payload = {};
  for (const segment of Object.values(segments)) {
    payload[segment] = Object.fromEntries(levels.map(level => [
      level, [...new Set(conversations.filter(row =>
        row.platform !== 'qq' && segments[row.kind] === segment && row.level === level).map(row => row.name))],
    ]));
  }
  payload.group_ids = Object.fromEntries(levels.map(level => [level, {}]));
  const previouslyBound = Object.assign({}, ...levels.map(level => bindings[level] || {}));
  for (const [id, name] of Object.entries(previouslyBound)) {
    const level = levels.find(key => payload.groups[key].includes(name));
    if (level) payload.group_ids[level][id] = name;
  }
  const groupsByName = new Map();
  for (const row of conversations) {
    if (row.platform === 'qq' || row.kind !== 'group' || !row.id) continue;
    const matches = groupsByName.get(row.name) || [];
    matches.push(row);
    groupsByName.set(row.name, matches);
  }
  const boundNames = new Set(Object.values(previouslyBound));
  for (const rows of groupsByName.values()) {
    const [row] = rows;
    if (rows.length === 1 && row.level && row.level !== row.savedLevel && !boundNames.has(row.name)) {
      payload.group_ids[row.level][row.id] = row.name;
    }
  }
  return payload;
}

$('#saveBtn').addEventListener('click', async () => {
  if (saving) return;
  saving = true;
  render();
  showMessage('正在保存…');
  const payload = scopePayload();
  try {
    const response = await fetch('/api/scope/config', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
      signal: AbortSignal.timeout(8000),
    });
    if (!response.ok) throw new Error('保存失败，请稍后重试。');
    lastConversationPayload = '';
    if (payload.group_ids) bindings = payload.group_ids;
    for (const row of platformRows()) row.savedLevel = row.level;
    showMessage(platform === 'wechat' ? '微信关注范围已保存，等待下一轮同步。' : '已保存 QQ 关注范围。');
    if (fromSetup && platform === 'wechat' && !conversations.some(row => row.level !== row.savedLevel)) location.assign('/');
  } catch (error) {
    showMessage(error.message);
  } finally {
    saving = false;
    render();
  }
});

load();
function refreshScope() {
  if (!document.hidden) load(true);
}
setInterval(refreshScope, 30000);
document.addEventListener('visibilitychange', refreshScope);
</script>
</body>
</html>
